apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-faces-postgres
  namespace: gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-faces-postgres
  template:
    metadata:
      labels:
        app: service-faces-postgres
    spec:
      containers:
        - name: service-faces-postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "faces"
            - name: POSTGRES_USER
              value: "faces"
            - name: POSTGRES_PASSWORD
              value: "faces"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: faces-postgres-pvc
